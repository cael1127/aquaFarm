services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquafarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquafarm}
      POSTGRES_DB: ${POSTGRES_DB:-aquafarm}
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquafarm} -d ${POSTGRES_DB:-aquafarm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aquafarm}:${POSTGRES_PASSWORD:-aquafarm}@timescaledb:5432/${POSTGRES_DB:-aquafarm}
      REDIS_URL: redis://redis:6379/0
      DEVICE_TOKEN: ${DEVICE_TOKEN:-dev-sensor-token}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      INGEST_STREAM: telemetry:ingest
      TELEMETRY_CHANNEL: telemetry:live
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aquafarm}:${POSTGRES_PASSWORD:-aquafarm}@timescaledb:5432/${POSTGRES_DB:-aquafarm}
      REDIS_URL: redis://redis:6379/0
      INGEST_STREAM: telemetry:ingest
      TELEMETRY_CHANNEL: telemetry:live
      ALERT_CHANNEL: telemetry:alerts
    volumes:
      - ./backend:/app
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3001:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy

  sensor-simulator:
    build:
      context: ./services/sensor-simulator
      dockerfile: Dockerfile
    environment:
      INGEST_URL: http://api:8000/api/v1/ingest
      DEVICE_TOKEN: ${DEVICE_TOKEN:-dev-sensor-token}
      RATE_PER_SEC: "50"
      FARM_ID: farm-alpha
    depends_on:
      api:
        condition: service_healthy

volumes:
  timescale_data:
